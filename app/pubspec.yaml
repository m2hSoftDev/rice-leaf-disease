name: ricedisease
description: "Rice leaf disease detection mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.2 <4.0.0'
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  flutter_riverpod: 2.6.1
  shared_preferences: 2.5.6
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/model_fp16.tflite
    - assets/labels.json
    - assets/preprocess_config.json
    - assets/fonts/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
